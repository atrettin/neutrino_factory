# End-to-end smoke test — GiBUU.
# Minimal real (non-stub) run to confirm the composed nf-base.sif can translate
# a config into a jobcard, run GiBUU.x (reading the jobcard from stdin, writing
# RootTuple output into the CWD), and normalize to the common HDF5.
# Event count is deliberately HIGHER than the other generators: GiBUU does not
# rejection-sample, it samples phase space uniformly and weights events by cross
# section, so the output is dominated by a small fraction of high-weight events.
# More events are needed for a representative dataset — and GiBUU is fast.

run:
  name: smoke_gibuu_c12
  seed: 12345
  executor: local
  stub_mode: false

jobs:
  - generator: gibuu
    code_version: "release2025"
    config_version: "default"
    events: 1000
    chunks: 1
    flux:
      type: power_law
      particle: numu
      emin_gev: 0.5
      emax_gev: 5.0
      gamma: -2.0
    target:
      nucleus: C12
    physics:
      mode: inclusive
      current: cc

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:20:00"
  cpus_per_task: 1
  mem: "2G"
