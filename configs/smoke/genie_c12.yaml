# End-to-end smoke test — GENIE.
# Minimal real (non-stub) run to confirm the composed nf-base.sif can translate
# a config, run gevgen, convert with gntpc, and normalize to the common HDF5.
# Requires the GENIE tune's cross-section spline staged on disk
# (setup/download_genie_xsec.sh --tune G18_10a_02_11a). Small event count keeps
# the run fast; spline loading dominates regardless.

run:
  name: smoke_genie_c12
  events: 50
  seed: 12345
  executor: local
  stub_mode: false
  # Keeps the gevgen job-configuration banner and the output-file writes while
  # dropping the per-spline and per-event NOTICE floods.
  log_level: essential

flux:
  type: power_law
  particle: numu
  emin_gev: 0.5
  emax_gev: 5.0
  gamma: -2.0

target:
  nucleus: C12
  pdg: 1000060120

physics:
  mode: inclusive
  current: cc

generators:
  genie:
    versions:
      - enabled: true
        code_version: "R-3_06_00"
        config_version: "G18_10a_02_11a"
  gibuu:
    versions:
      - enabled: false
        code_version: "release2025"
        config_version: "default"
  neut:
    versions:
      - enabled: false
        code_version: "5.7.0-nuint2024"
        config_version: "default"
  nuwro:
    versions:
      - enabled: false
        code_version: "nuwro_25.11"
        config_version: "default"

splitting:
  strategy: events
  chunks: 1

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
