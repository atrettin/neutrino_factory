# End-to-end smoke test — antineutrino beam.
# The counterpart of the per-generator smoke configs for a non-numu probe: it
# exercises the flavour paths that used to be numu-only (NEUT's flavour-named
# normalization histograms, GiBUU's negative process_ID, GENIE's per-probe
# cross-section splines). One job at a time keeps the run short; add another
# entry to the matrix `include` list below to cover a second generator.

run:
  name: smoke_nuebar_c12
  seed: 12345
  executor: local
  stub_mode: false

macros:
  nuebar_c12:
    params:
      generator: null
      code_version: null
      config_version: null
    job:
      generator: "{{generator}}"
      code_version: "{{code_version}}"
      config_version: "{{config_version}}"
      events: 50
      chunks: 1
      flux:
        type: power_law
        particle: nuebar
        emin_gev: 0.5
        emax_gev: 5.0
        gamma: -2.0
      target:
        nucleus: C12
      physics:
        mode: inclusive
        current: cc

jobs:
  - use: nuebar_c12
    matrix:
      include:
        - {generator: neut, code_version: "5.7.0-nuint2024", config_version: "default"}
        # - {generator: nuwro, code_version: "nuwro_25.11", config_version: "default"}
        # - {generator: genie, code_version: "R-3_06_00", config_version: "G18_10a_02_11a"}
        # - {generator: gibuu, code_version: "release2025", config_version: "default"}

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
