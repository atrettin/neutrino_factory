# End-to-end smoke test — antineutrino beam, all four generators.
# The counterpart of the per-generator smoke configs for a non-numu probe: it
# exercises the flavour paths that used to be numu-only (NEUT's flavour-named
# normalization histograms, GiBUU's negative process_ID, GENIE's per-probe
# cross-section splines). Enable one generator at a time to keep the run short.

run:
  name: smoke_nuebar_c12
  events: 50
  seed: 12345
  executor: local
  stub_mode: false

flux:
  type: power_law
  particle: nuebar
  emin_gev: 0.5
  emax_gev: 5.0
  gamma: -2.0

target:
  nucleus: C12
  pdg: 1000060120

physics:
  mode: inclusive
  current: cc

generators:
  neut:
    versions:
      - enabled: true
        code_version: "5.7.0-nuint2024"
        config_version: "default"
  nuwro:
    versions:
      - enabled: false
        code_version: "nuwro_25.11"
        config_version: "default"
  genie:
    versions:
      - enabled: false
        code_version: "R-3_06_00"
        config_version: "G18_10a_02_11a"
  gibuu:
    versions:
      - enabled: false
        code_version: "release2025"
        config_version: "default"

splitting:
  strategy: events
  chunks: 1

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
