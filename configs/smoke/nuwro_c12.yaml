# End-to-end smoke test — NuWro.
# Minimal real (non-stub) run to confirm the composed nf-base.sif can translate
# a config, run nuwro (from its install tree, resolving data/ relatively), and
# normalize the ROOT output to the common HDF5.

run:
  name: smoke_nuwro_c12
  seed: 12345
  executor: local
  stub_mode: false

jobs:
  - generator: nuwro
    code_version: "nuwro_25.11"
    config_version: "default"
    events: 50
    chunks: 1
    flux:
      type: power_law
      particle: numu
      emin_gev: 0.5
      emax_gev: 5.0
      gamma: -2.0
    target:
      nucleus: C12
    physics:
      mode: inclusive
      current: cc

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
