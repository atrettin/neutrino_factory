# End-to-end smoke test — NuWro.
# Minimal real (non-stub) run to confirm the composed nf-base.sif can translate
# a config, run nuwro (from its install tree, resolving data/ relatively), and
# normalize the ROOT output to the common HDF5.

run:
  name: smoke_nuwro_c12
  events: 50
  seed: 12345
  executor: local
  stub_mode: false

flux:
  type: power_law
  particle: numu
  emin_gev: 0.5
  emax_gev: 5.0
  gamma: -2.0

target:
  nucleus: C12
  pdg: 1000060120

physics:
  mode: inclusive
  current: cc

generators:
  nuwro:
    versions:
      - enabled: true
        code_version: "nuwro_25.11"
        config_version: "default"
  genie:
    versions:
      - enabled: false
        code_version: "R-3_06_00"
        config_version: "G18_10a_02_11a"
  gibuu:
    versions:
      - enabled: false
        code_version: "release2025"
        config_version: "default"
  neut:
    versions:
      - enabled: false
        code_version: "5.7.0-nuint2024"
        config_version: "default"

splitting:
  strategy: events
  chunks: 1

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
