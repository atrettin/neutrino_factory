# Real (non-stub) NuWro and GiBUU on argon.
# The two generators need different settings for comparable results: GiBUU is
# cross-section-weighted rather than rejection-sampled, so it needs a flatter
# spectrum (gamma = -1) and far more events than NuWro to reach the same
# statistical uncertainty. Per-job flux and event budgets are exactly what makes
# running both from one file possible.
run:
  name: power_law_numu_ar40
  seed: 12345
  executor: local
  stub_mode: false

jobs:
  - generator: nuwro
    code_version: "nuwro_25.11"
    config_version: "default"
    events: 100000
    chunks: 1
    flux:
      type: power_law
      particle: numu
      emin_gev: 0.5
      emax_gev: 10.0
      gamma: -2.0
    target:
      nucleus: Ar40
    physics:
      mode: inclusive
      current: cc

  - generator: gibuu
    code_version: "release2025"
    config_version: "default"
    events: 1000000
    chunks: 1
    flux:
      type: power_law
      particle: numu
      emin_gev: 0.5
      emax_gev: 10.0
      gamma: -1.0     # flat in ln(E): uniform statistical uncertainty per log bin
    target:
      nucleus: Ar40
    physics:
      mode: inclusive
      current: cc

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
