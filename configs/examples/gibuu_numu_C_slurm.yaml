# GiBUU on carbon, Slurm array run (5 chunks -> 5 array tasks).
run:
  name: gibuu_numu_c12
  seed: 12345
  executor: slurm
  stub_mode: false

jobs:
  - generator: gibuu
    code_version: "release2025"
    config_version: "default"
    events: 1000000
    chunks: 5
    flux:
      type: power_law
      particle: numu
      emin_gev: 0.5
      emax_gev: 5.0
      gamma: -2.0
    target:
      nucleus: C12
    physics:
      mode: inclusive
      current: cc

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:20:00"
  cpus_per_task: 1
  mem: "2G"
