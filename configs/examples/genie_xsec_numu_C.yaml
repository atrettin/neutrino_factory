run:
  name: genie_xsec_numu_c12
  seed: 12345
  executor: local
  stub_mode: false

jobs:
  - generator: genie
    code_version: "R-3_06_00"
    config_version: "G18_10a_02_11a"
    events: 100
    chunks: 1
    flux:
      type: power_law
      particle: numu
      emin_gev: 0.5
      emax_gev: 5.0
      gamma: -2.0
    target:
      nucleus: C12
    physics:
      mode: inclusive
      current: cc

storage:
  software_root: ${NF_SOFTWARE_ROOT:-./software}
  output_root: ${NF_OUTPUT_ROOT:-./output}
  work_root: ${NF_WORK_ROOT:-./work}

slurm:
  partition: alma
  time: "00:10:00"
  cpus_per_task: 1
  mem: "2G"
