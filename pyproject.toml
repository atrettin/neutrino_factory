[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutrino-factory"
version = "0.1.0"
description = "Local-first orchestration scaffold for neutrino event generators on Slurm"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Neutrino Factory contributors" }
]
dependencies = [
  "PyYAML>=6.0",
  "h5py>=3.10",
  "numpy>=1.24",
  "uproot>=5.0",
  "awkward>=2.0",
]

[project.scripts]
neutrino-factory = "neutrino_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
